[config]

#[templates.dunst]
#input_path = './templates/dunst-colors.conf'
#output_path = '~/.config/dunst/dunstrc'
#post_hook = 'dunstctl reload'

[templates.hyprland]
input_path = './templates/hyprland-colors.lua'
output_path = '~/.config/hypr/generated-colors.lua'

[templates.hyprlock]
input_path = './templates/hyprlock-colors.conf'
output_path = '~/.config/hypr/generated-colors.conf'

[templates.kitty]
input_path = './templates/kitty-colors.conf'
output_path = '~/.config/kitty/themes/generated-colors.conf'

[templates.gtk3]
input_path = './templates/gtk-colors.css'
output_path = '~/.config/gtk-3.0/colors.css'
post_hook = '~/.config/matugen/post-hook-scripts/gtk-3.sh {{mode}}'

[templates.gtk4]
input_path = './templates/gtk-colors.css'
output_path = '~/.config/gtk-4.0/colors.css'
post_hook = '~/.config/matugen/post-hook-scripts/gtk-4.sh; ~/.config/matugen/post-hook-scripts/gtk-themes-reload.sh'

[templates.kvantum_kvconfig]
input_path = './templates/KvMatugen.kvconfig'
output_path = '~/.config/Kvantum/KvMatugen/KvMatugen.kvconfig'

[templates.kvantum_svg]
input_path = './templates/KvMatugen.svg'
output_path = '~/.config/Kvantum/KvMatugen/KvMatugen.svg'

[templates.quickshell]
input_path = "./templates/qs-colors.qml"
output_path = "~/.config/quickshell/modules/common/MatugenColors.qml"

[templates.starship]
input_path = './templates/starship-colors.toml'
output_path = '~/.config/starship.toml'

#[templates.waybar]
#input_path = './templates/matugen-colors.css'
#output_path = '~/.config/waybar/tokens/generated-colors.css'
#post_hook = 'pkill -SIGUSR2 waybar'

[templates.vscode-raw]
input_path = './templates/vscode-colors'
output_path = '~/.cache/matugen/vscode-colors'

[templates.vscode-json]
input_path = './templates/vscode-colors.json'
output_path = '~/.cache/matugen/vscode-colors.json'

[templates.zed]
input_path = './templates/zed-colors.json'
output_path = '~/.config/zed/themes/matugen.json'